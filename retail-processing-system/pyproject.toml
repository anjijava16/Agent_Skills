[project]
name = "retail-processing-system"
version = "0.1.0"
description = "Multi-agent retail processing system with 10 FastMCP servers, 10 A2A agents, and 1 orchestrator"
requires-python = ">=3.11"

dependencies = [
    "google-adk[a2a]>=1.0.0",
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
