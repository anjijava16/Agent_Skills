[project]
name = "bank-finance-system"
version = "0.1.0"
description = "Multi-Agent Bank Finance System with 10 A2A agents, 10 MCP servers, and 1 orchestrator"
requires-python = ">=3.11"
dependencies = [
    "google-adk[a2a]>=1.0.0",
    "mcp>=1.0.0",
    "uvicorn>=0.30.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
